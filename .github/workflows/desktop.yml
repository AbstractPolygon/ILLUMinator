# Builds the desktop app installers on GitHub's own machines: a Windows
# installer (.exe) and macOS disk images (.dmg, Apple Silicon and Intel).
# Run it from the Actions tab (Build desktop apps → Run workflow): the
# installers are attached to the run, under Artifacts. With "Publish a
# release" ticked (or when a version tag such as v0.5.2 is pushed) they are
# also published as a GitHub Release, tagged with package.json's version. They are not code signed: Windows SmartScreen and macOS
# Gatekeeper warn on first launch.
name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (tagged v<package.json version>)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No signing certificate: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v6
        with:
          name: ILLUMinator-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          version="${tag#v}"
          cat > notes.md <<NOTES
          ILLUMinator ${version}.

          - **Windows:** \`ILLUMinator-${version}-win-x64.exe\`
          - **macOS:** \`ILLUMinator-${version}-mac-arm64.dmg\` (Apple Silicon) or \`ILLUMinator-${version}-mac-x64.dmg\` (Intel)

          The installers are not code signed. On Windows, choose *More info → Run anyway* if SmartScreen warns. On macOS, right-click the app and choose *Open* the first time.
          NOTES
          gh release create "$tag" dist/*.exe dist/*.dmg --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "ILLUMinator ${version}" \
            --notes-file notes.md --generate-notes
