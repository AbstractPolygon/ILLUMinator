# Builds the desktop app installers on GitHub's machines: Windows
# installers (.exe, x64 and ARM64), macOS disk images (.dmg, Apple Silicon and Intel) and
# Linux packages (.AppImage and .deb, x64), plus the web version as a .zip
# for any static web server.
# Run it from the Actions tab (Build desktop apps → Run workflow): the
# installers are attached to the run, under Artifacts. With "Publish a
# release" ticked (or when a version tag such as v0.5.2 is pushed) they are
# also published as a GitHub Release, tagged with package.json's version.
# They are not code signed: Windows SmartScreen and macOS Gatekeeper warn on
# first launch.
name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (tagged v<package.json version>)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac
          - os: ubuntu-latest
            name: linux
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No signing certificate: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the MSI installer's desktop option
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist -Filter *.msi | Select-Object -First 1).FullName
          Write-Host "MSI: $msi"

          # The checkbox is on the Finish page ("Completing the setup wizard"), and the Finish button makes the shortcut.
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi, 0))
          function Query($sql) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            $rows = @()
            while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
              $rows += $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
            }
            $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null) | Out-Null
            return $rows
          }
          if ((Query "SELECT Control FROM Control WHERE Dialog_='ExitDialog' AND Control='DesktopCheck' AND Property='ADDTODESKTOP'").Count -ne 1) { throw 'The Add to desktop checkbox is missing from the Finish page' }
          if ((Query "SELECT Value FROM CheckBox WHERE Property='ADDTODESKTOP'").Count -ne 1) { throw 'The checkbox has no value' }
          if ((Query "SELECT Dialog_ FROM ControlEvent WHERE Dialog_='ExitDialog' AND Control_='Finish' AND Argument='CreateDesktopShortcut'").Count -lt 1) { throw 'The Finish button does not make the shortcut' }
          if ((Query "SELECT Action FROM CustomAction WHERE Action='CreateDesktopShortcut'").Count -ne 1) { throw 'The shortcut action is missing' }
          Write-Host 'Finish page checkbox present'

          # Silent installs: ticked by default, off with ADDTODESKTOP=0.
          $links = @("$env:PUBLIC\Desktop\Illuminator.lnk", "$env:USERPROFILE\Desktop\Illuminator.lnk")
          function Has-Link { return @($links | Where-Object { Test-Path $_ }).Count -gt 0 }
          function Msi($argList) {
            $p = Start-Process msiexec.exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec $argList exited with $($p.ExitCode)" }
          }
          Msi "/i `"$msi`" /qn /norestart /l*v $env:RUNNER_TEMP\msi-default.log"
          if (-not (Has-Link)) { throw 'Default install: no desktop shortcut' }
          Msi "/x `"$msi`" /qn /norestart"
          if (Has-Link) { throw 'Uninstall left the desktop shortcut behind' }
          Msi "/i `"$msi`" ADDTODESKTOP=0 /qn /norestart /l*v $env:RUNNER_TEMP\msi-nodesktop.log"
          if (Has-Link) { throw 'ADDTODESKTOP=0 still created a desktop shortcut' }
          Msi "/x `"$msi`" /qn /norestart"
          Write-Host 'MSI desktop option works'

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: Illuminator-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: |
          name="Illuminator-$(node -p "require('./package.json').version")-web"
          npm run build:web -- --out "dist/$name"
          cd dist && zip -qr "$name.zip" "$name"

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: Illuminator-${{ steps.version.outputs.version }}-web
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          version="${tag#v}"
          cat > notes.md <<NOTES
          Illuminator ${version}.

          - **Windows:** \`Illuminator-${version}-win-x64.exe\` (Intel and AMD) or \`Illuminator-${version}-win-arm64.exe\` (ARM, such as Snapdragon), or \`Illuminator-${version}-win-x64.msi\` (Windows Installer package, for managed installs)
          - **macOS:** \`Illuminator-${version}-mac-arm64.dmg\` (Apple Silicon) or \`Illuminator-${version}-mac-x64.dmg\` (Intel)
          - **Linux:** \`Illuminator-${version}-linux-amd64.deb\` (Debian, Ubuntu) or \`Illuminator-${version}-linux-x86_64.AppImage\` (other distributions)
          - **Web:** \`Illuminator-${version}-web.zip\`, to unzip onto any static web server

          The installers are not code signed. On Windows, choose *More info → Run anyway* if SmartScreen warns. On macOS, right-click the app and choose *Open* the first time. On Linux, make the AppImage executable (\`chmod +x\`) before running it.
          NOTES
          files=(dist/*.exe dist/*.msi dist/*.dmg dist/*.AppImage dist/*.deb dist/*.zip)
          # Run again for a version already released: replace its files and notes.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" --title "Illuminator ${version}" \
              --notes-file notes.md --generate-notes
          fi
