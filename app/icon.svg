<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Hexagon Boundaries -->
  <polygon points="12,3 19.79,7.5 19.79,16.5 12,21 4.21,16.5 4.21,7.5" />

  <!-- Spokes Connecting Center to Outer Nodes -->
  <line x1="12" y1="12" x2="12" y2="3" />
  <line x1="12" y1="12" x2="19.79" y2="7.5" />
  <line x1="12" y1="12" x2="19.79" y2="16.5" />
  <line x1="12" y1="12" x2="12" y2="21" />
  <line x1="12" y1="12" x2="4.21" y2="16.5" />
  <line x1="12" y1="12" x2="4.21" y2="7.5" />

  <!-- Hexagonal Nodes (Dots) -->
  <circle cx="12" cy="3" r="1.0" fill="currentColor" stroke="none" />
  <circle cx="19.79" cy="7.5" r="1.0" fill="currentColor" stroke="none" />
  <circle cx="19.79" cy="16.5" r="1.0" fill="currentColor" stroke="none" />
  <circle cx="12" cy="21" r="1.0" fill="currentColor" stroke="none" />
  <circle cx="4.21" cy="16.5" r="1.0" fill="currentColor" stroke="none" />
  <circle cx="4.21" cy="7.5" r="1.0" fill="currentColor" stroke="none" />
  <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none" />
</svg>
